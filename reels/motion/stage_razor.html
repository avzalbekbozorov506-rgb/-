const rz=el(r,'abs','','left:330px;top:760px;width:420px;height:520px');rz.innerHTML=RAZORSVG;const sh=el(r,'abs','','left:340px;top:1235px;width:400px;height:40px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.5),transparent 70%)');
