<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:#0e0805;overflow:hidden}

.scene{position:absolute;inset:0;will-change:transform,opacity,filter}
.w{display:inline-block;will-change:transform,opacity,filter}
.h1{font-weight:900;letter-spacing:-1px;line-height:1.02}
.glow-g{color:#4dffb0;text-shadow:0 0 40px rgba(60,255,170,.55),0 0 90px rgba(60,255,170,.25)}
.glow-y{color:#ffc83d;text-shadow:0 0 40px rgba(255,190,50,.5),0 0 90px rgba(255,190,50,.2)}
.glow-r{color:#ff5468;text-shadow:0 0 40px rgba(255,70,90,.55),0 0 90px rgba(255,70,90,.25)}
.glow-c{color:#6fd8ff;text-shadow:0 0 40px rgba(80,200,255,.5)}

.win{background:linear-gradient(160deg,#16213f,#0d1630);border:2px solid rgba(110,170,255,.55);border-radius:30px;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 80px rgba(70,130,255,.25)}
.bar{height:62px;border-radius:30px 30px 0 0;background:rgba(255,255,255,.07);display:flex;align-items:center;padding:0 26px;gap:12px;font-weight:700;font-size:26px;color:#9fb4d8}
.dot{width:20px;height:20px;border-radius:50%}
.card{background:linear-gradient(160deg,rgba(28,40,74,.95),rgba(14,22,46,.95));border-radius:30px;border:3px solid;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#subpill{position:absolute;right:54px;top:136px;padding:12px 26px;border-radius:30px;background:linear-gradient(90deg,#ffb830,#ff8a30);color:#1a1000;font-weight:900;font-size:26px;box-shadow:0 0 30px rgba(255,170,50,.5)}
#subs{position:absolute;left:60px;width:960px;top:1500px;text-align:center;font-weight:800;font-size:54px;line-height:1.25}
#subs .sp{display:inline-block;background:rgba(8,12,24,.62);backdrop-filter:blur(10px);padding:14px 30px;border-radius:30px}
#hud{position:absolute;left:54px;right:54px;top:64px;font-size:22px;font-weight:700;color:#7f97c4;letter-spacing:2px}
#hudbar{position:absolute;left:54px;right:54px;top:112px;height:5px;background:rgba(255,255,255,.1);border-radius:3px}
#hudfill{height:100%;background:linear-gradient(90deg,#4ab0ff,#4dffb0);border-radius:3px;box-shadow:0 0 14px #4ab0ff}
</style></head><body><div id="stage">
<div class="blob" id="b1" style="width:900px;height:900px;background:rgba(255,150,60,.30)"></div>
<div class="blob" id="b2" style="width:800px;height:800px;background:rgba(255,90,60,.22)"></div>
<div class="blob" id="b3" style="width:700px;height:700px;background:rgba(255,200,90,.18)"></div>

<div id="scenes"></div>

<div id="subpill">+ ПОДПИСАТЬСЯ</div><div id="subs"></div>
</div>
<script>
const TL=window.TL||{scenes:[],dur:1};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={lin:x=>x,oc:x=>1-Math.pow(1-x,3),oe:x=>x==1?1:1-Math.pow(2,-10*x),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
ob:x=>{const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
oel:x=>x==0||x==1?x:Math.pow(2,-9*x)*Math.sin((x*10-.75)*(2*Math.PI/3))+1};
const tw=(t,a,b,f=E.oc)=>f(clamp((t-a)/(b-a)));
const px=(n)=>Math.round(n*100)/100;
function el(parent,cls,html,css){const d=document.createElement('div');d.className=cls||'';if(html!=null)d.innerHTML=html;if(css)d.style.cssText=css;parent.appendChild(d);return d}
function words(parent,text,css,cls){const d=el(parent,'abs c h1 '+(cls||''),'',css);d._w=text.split(' ').map(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;d.appendChild(s);d.appendChild(document.createTextNode(' '));return s});return d}
function popWords(d,lt,t0,step=.09,dur=.5){d._w.forEach((s,i)=>{const p=tw(lt,t0+i*step,t0+i*step+dur,E.ob);const o=tw(lt,t0+i*step,t0+i*step+.25);s.style.opacity=o;s.style.transform=`translateY(${px((1-p)*70)}px) scale(${px(.6+.4*p)})`;s.style.filter=`blur(${px((1-o)*14)}px)`})}
const nf=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const S={};const root=document.getElementById('scenes');
function mk(name,fn){const r=el(root,'scene','');r.style.display='none';S[name]={r,upd:fn(r)};}
// ---------- сцены (иллюстрации) ----------
const NS='http://www.w3.org/2000/svg';
function svg(r,inner){const d=el(r,'abs','', 'left:0;top:0;width:1080px;height:1500px');d.innerHTML='<svg width="1080" height="1500" viewBox="0 0 1080 1500">'+inner+'</svg>';return d.firstChild}
const SKIN='#e6b995',SK2='#d9a37c';
function person(o){const {c='#6b7aa8',h='#3a2a22',sk=SKIN,long=false,pants='#2f3140',kid=false}=o;const k=kid?.55:1;
return `<g class="p" style="transform-origin:0 0"><rect x="-34" y="-20" width="26" height="150" rx="10" fill="${pants}"/><rect x="8" y="-20" width="26" height="150" rx="10" fill="${pants}"/>
<rect x="-52" y="-210" width="104" height="200" rx="34" fill="${c}"/><g class="armL"><rect x="-76" y="-200" width="26" height="150" rx="13" fill="${c}"/></g><g class="armR"><rect x="50" y="-200" width="26" height="150" rx="13" fill="${c}"/></g>
<rect x="-12" y="-236" width="24" height="34" fill="${sk}"/><circle cx="0" cy="-270" r="44" fill="${sk}"/>${long?`<path d="M-48 -270 a48 48 0 0 1 96 0 v50 q-8 30 -22 8 v-40 h-52 v40 q-14 22 -22 -8z" fill="${h}"/>`:`<path d="M-46 -272 a46 46 0 0 1 92 0 q-20 -26 -46 -22 q-26 -4 -46 22z" fill="${h}"/>`}</g>`}
function place(id,x,y,s,o){return `<g id="${id}" transform="translate(${x},${y}) scale(${s})">${person(o)}</g>`}
const ROOM=(w,f)=>`<rect width="1080" height="1500" fill="${w}"/><rect y="1050" width="1080" height="450" fill="${f}"/><rect y="1040" width="1080" height="14" fill="rgba(0,0,0,.25)"/>`;
const GLOW=(x,y,r,c)=>`<defs><radialGradient id="gl${x}${y}"><stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs><circle cx="${x}" cy="${y}" r="${r}" fill="url(#gl${x}${y})"/>`;
function chip(r,text,css){return el(r,'abs','<span class="chip" style="font-size:44px;border-color:#ffc46a;color:#ffd28a">'+text+'</span>',css||'left:60px;top:200px')}
function setArm(g,sel,deg){const a=g.querySelector(sel);if(a)a.setAttribute('transform',`rotate(${deg} ${sel==='.armL'?-63:63} -195)`)}
function cam(r,lt,dur,z0=1,z1=1.07){const z=z0+(z1-z0)*lt/dur;r.firstChild&&0}
// d1
mk('d1',r=>{const s=svg(r,ROOM('#3b2a20','#5a4030')+GLOW(540,200,500,'#ffb050')+'<rect x="700" y="260" width="240" height="320" rx="10" fill="#1d2a44"/><rect x="705" y="265" width="110" height="310" fill="#26385e"/>'+place('A',420,1130,1.9,{c:'#c27a6b',h:'#3a2218',long:true})+place('M',660,1130,2.0,{c:'#5f7aa6',h:'#2a1f1a'}));const t=chip(r,'ПОНЕДЕЛЬНИК');
const bar=el(r,'abs','<div style="width:700px;height:16px;border-radius:8px;background:rgba(255,255,255,.15)"><div id="pbar1" style="height:100%;border-radius:8px;background:linear-gradient(90deg,#ffb050,#ff7a50)"></div></div><div style="display:flex;justify-content:space-between;font:800 36px Inter;color:#ffd28a;margin-top:10px"><span>9:00</span><span>18:00</span></div>','left:190px;top:1230px');
return (lt,dur)=>{const p=E.oc(clamp(lt/.8));s.querySelector('#A').setAttribute('transform',`translate(${420-200*(1-p)},1130) scale(1.9)`);s.querySelector('#M').setAttribute('transform',`translate(${660+200*(1-p)},1130) scale(2)`);bar.querySelector('#pbar1').style.width=(100*tw(lt,.8,dur-.4,E.io))+'%';t.style.opacity=tw(lt,.2,.6)}});
// d2
mk('d2',r=>{const s=svg(r,ROOM('#4a3324','#6a4a34')+GLOW(540,180,520,'#ffc060')+'<rect x="80" y="420" width="300" height="190" fill="#2a1c14"/><rect x="740" y="640" width="260" height="300" rx="14" fill="#3a2a20"/><rect x="600" y="940" width="400" height="30" fill="#7a5638"/>'+place('A',330,1130,2,{c:'#c27a6b',h:'#3a2218',long:true})+place('K1',700,1130,1.5,{c:'#7aa0d0',kid:1,h:'#4a3020'})+place('K2',850,1130,1.2,{c:'#d0a07a',kid:1,h:'#2a1a12'}));const t=chip(r,'06:30');
const st=[...Array(8)].map((_,i)=>el(r,'abs','','width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(6px);left:'+(420+i*4)+'px;top:900px'));
return (lt)=>{setArm(s.querySelector('#A'),'.armR',-40+Math.sin(lt*6)*14);st.forEach((q,i)=>{const u=(lt*.7+i/8)%1;q.style.top=(900-u*260)+'px';q.style.opacity=.7*Math.sin(u*Math.PI);q.style.left=(430+Math.sin(u*6+i)*20)+'px'});t.style.opacity=tw(lt,.2,.6)}});
// d3
mk('d3',r=>{const s=svg(r,ROOM('#33271f','#523a2b')+GLOW(540,160,480,'#ffb868')+'<rect x="120" y="260" width="260" height="620" rx="14" fill="#4a3426"/><rect x="740" y="300" width="250" height="560" rx="12" fill="#5a3d2b"/>'+place('M',540,1130,2,{c:'#5f7aa6',h:'#2a1f1a'})+'<rect x="660" y="1020" width="110" height="80" rx="10" fill="#222"/>');const t=chip(r,'07:30');
return (lt)=>{const g=s.querySelector('#M');g.setAttribute('transform',`translate(${540+Math.sin(lt*1.5)*20},1130) scale(2)`);setArm(g,'.armR',-20+Math.sin(lt*3)*10);t.style.opacity=tw(lt,.2,.6)}});
// d4
mk('d4',r=>{const s=svg(r,ROOM('#2d2420','#4a3830')+GLOW(540,200,480,'#ffa850')+'<rect x="420" y="300" width="240" height="640" rx="10" fill="#3a2a22"/>'+place('A',360,1130,2,{c:'#c27a6b',h:'#3a2218',long:true})+place('M',720,1130,2,{c:'#5f7aa6',h:'#2a1f1a'}));const t=chip(r,'18:30');
return (lt,dur)=>{const p=E.oc(clamp(lt/1.2));['A','M'].forEach((id,i)=>{const g=s.querySelector('#'+id);const x=(i?720:360);g.setAttribute('transform',`translate(${x+(i?1:-1)*260*(1-p)},${1130+Math.sin(lt*3)*4}) scale(2) rotate(${(i?1:-1)*5*p})`)});t.style.opacity=tw(lt,.2,.6)}});
// d5
mk('d5',r=>{const s=svg(r,ROOM('#3a2d27','#5a4438')+GLOW(300,320,420,'#ffc070')+'<rect x="640" y="640" width="300" height="360" rx="26" fill="#d8d8de"/><circle cx="790" cy="800" r="100" fill="#8a96b0"/><circle cx="790" cy="800" r="70" fill="#33405a"/><rect x="100" y="900" width="360" height="26" fill="#7a5638"/>'+place('A',280,1130,2,{c:'#c27a6b',h:'#3a2218',long:true}));const t=chip(r,'19:00 → 22:00');
const items=['ужин','стирка','уроки','купание'].map((x,i)=>el(r,'abs','','left:560px;top:'+(1160+i*62)+'px;font:800 46px Inter;color:#9fe0b0;opacity:0'));
return (lt,dur)=>{const w=s.querySelector('circle:nth-of-type(2)');setArm(s.querySelector('#A'),'.armL',-30+Math.sin(lt*5)*18);items.forEach((it,i)=>{const p=tw(lt,.6+i*.7,.9+i*.7);it.textContent='✓ '+['ужин','стирка','уроки','купание'][i];it.style.opacity=p;it.style.transform=`translateX(${(1-p)*40}px)`});t.style.opacity=tw(lt,.2,.6)}});
// d6
mk('d6',r=>{const s=svg(r,ROOM('#2a2320','#463a34')+'<rect x="180" y="880" width="720" height="260" rx="40" fill="#6a4a40"/><rect x="180" y="800" width="720" height="140" rx="40" fill="#7a5a50"/>'+place('M',540,1060,1.9,{c:'#5f7aa6',h:'#2a1f1a'}));const tv=el(r,'abs','','left:700px;top:300px;width:300px;height:200px;border-radius:14px;background:#6aa8ff;opacity:.5;filter:blur(30px)');const t=chip(r,'20:00');
const ph=el(r,'abs','','left:520px;top:900px;width:70px;height:120px;border-radius:12px;background:#9fd0ff;box-shadow:0 0 90px 30px rgba(120,190,255,.6)');
return (lt)=>{ph.style.opacity=.75+.25*Math.sin(lt*14);tv.style.opacity=.35+.15*Math.sin(lt*9);t.style.opacity=tw(lt,.2,.6)}});
// d7
mk('d7',r=>{const b=el(r,'abs c h1 glow-y','ПОМЕНЯЛИСЬ','top:560px;font-size:112px');const A=el(r,'abs','АНЯ','left:200px;top:900px;width:260px;height:260px;border-radius:50%;background:#c27a6b;font:900 70px/260px Inter;text-align:center;box-shadow:0 0 70px rgba(194,122,107,.6)');const M=el(r,'abs','МАРК','left:620px;top:900px;width:260px;height:260px;border-radius:50%;background:#5f7aa6;font:900 70px/260px Inter;text-align:center;box-shadow:0 0 70px rgba(95,122,166,.6)');
const m=el(r,'abs c','<span class="chip" style="font-size:44px;border-color:#ffc46a;color:#ffd28a">ЧЕРЕЗ МЕСЯЦ</span>','top:300px');
return (lt,dur)=>{const p=tw(lt,1.4,2.6,E.io);b.style.transform=`scale(${.5+.5*E.ob(clamp(lt/.7))})`;b.style.opacity=tw(lt,0,.3);A.style.left=(200+420*p)+'px';M.style.left=(620-420*p)+'px';A.style.top=(900-120*Math.sin(p*Math.PI))+'px';M.style.top=(900+120*Math.sin(p*Math.PI))+'px';m.style.opacity=tw(lt,.2,.6)}});
// d8
mk('d8',r=>{const s=svg(r,ROOM('#4a3324','#6a4a34')+GLOW(540,180,520,'#ffc060')+'<rect x="740" y="640" width="260" height="300" rx="14" fill="#3a2a20"/><rect x="600" y="940" width="400" height="30" fill="#7a5638"/>'+place('M',330,1130,2,{c:'#5f7aa6',h:'#2a1f1a'})+place('K1',700,1130,1.5,{c:'#7aa0d0',kid:1,h:'#4a3020'})+place('K2',850,1130,1.2,{c:'#d0a07a',kid:1,h:'#2a1a12'}));const t=chip(r,'06:30 · ДЕНЬ № 1');
const cnt=el(r,'abs c h1 glow-g','','top:1250px;font-size:76px');
return (lt,dur)=>{setArm(s.querySelector('#M'),'.armR',-40+Math.sin(lt*6)*14);cnt.textContent='дел сделано: '+Math.round(12*tw(lt,.4,dur-.5,E.io));t.style.opacity=tw(lt,.2,.6)}});
// d9
mk('d9',r=>{const s=svg(r,ROOM('#241c1a','#3c2e2a')+'<rect x="200" y="900" width="680" height="30" fill="#7a5638"/><rect x="260" y="930" width="26" height="170" fill="#5a3f28"/><rect x="800" y="930" width="26" height="170" fill="#5a3f28"/>'+place('M',540,1090,1.9,{c:'#5f7aa6',h:'#2a1f1a'})+'<rect x="720" y="300" width="260" height="300" rx="150" fill="#fff3d0" opacity=".9"/>');const t=chip(r,'22:00');
const bub=el(r,'abs','<div style="padding:30px 44px;border-radius:50px;background:#fff;color:#241c1a;font:800 52px/1.2 Inter;text-align:center">Я не знал,<br>что это столько</div>','left:230px;top:260px;width:620px');
return (lt)=>{const g=s.querySelector('#M');g.setAttribute('transform',`translate(540,${1090+Math.sin(lt*2)*3}) scale(1.9) rotate(${-4})`);bub.style.opacity=tw(lt,.8,1.2);bub.style.transform=`scale(${.6+.4*E.ob(clamp((lt-.8)/.6))})`;t.style.opacity=tw(lt,.2,.6)}});
// d10
mk('d10',r=>{const a=el(r,'abs h1','РАБОТА','left:110px;top:520px;font-size:80px;color:#9fd0ff');const b=el(r,'abs h1','ДОМ','left:110px;top:760px;font-size:80px;color:#ffb070');
const ba=el(r,'abs','','left:110px;top:640px;height:60px;border-radius:30px;background:linear-gradient(90deg,#4a90ff,#7ad0ff)');const bb=el(r,'abs','','left:110px;top:880px;height:60px;border-radius:30px;background:linear-gradient(90deg,#ff7a30,#ffc060)');
const t=el(r,'abs c h1 glow-y','ДВЕ СМЕНЫ','top:1100px;font-size:130px');
return (lt)=>{ba.style.width=(860*tw(lt,.3,1.2,E.oe))+'px';bb.style.width=(860*tw(lt,1.2,2.2,E.oe))+'px';t.style.opacity=tw(lt,2.6,3.0);t.style.transform=`scale(${.6+.4*E.ob(clamp((lt-2.6)/.6))})`}});
// d11
mk('d11',r=>{const s=svg(r,ROOM('#3b2a20','#5a4030')+GLOW(540,200,520,'#ffb050')+place('A',440,1130,1.9,{c:'#c27a6b',h:'#3a2218',long:true})+place('M',640,1130,2,{c:'#5f7aa6',h:'#2a1f1a'}));
const t=el(r,'abs c h1','<span class="glow-y">ПОДЕЛИТЕ ДОМ —</span><br><span style="color:#fff">ПОДЕЛИТЕ УСТАЛОСТЬ</span>','top:300px;font-size:76px');
const b=el(r,'abs c','<span style="display:inline-block;padding:28px 54px;border-radius:70px;background:linear-gradient(90deg,#ffb830,#ff8a30);color:#1a1000;font:900 44px Inter;box-shadow:0 0 60px rgba(255,170,50,.55)">ОТПРАВЬ ТОМУ, С КЕМ ДЕЛИШЬ ДОМ</span>','top:1180px');
return (lt,dur)=>{const p=E.oc(clamp(lt/1));s.querySelector('#A').setAttribute('transform',`translate(${440-100*(1-p)+60*p},1130) scale(1.9)`);s.querySelector('#M').setAttribute('transform',`translate(${640+100*(1-p)-60*p},1130) scale(2)`);t.style.opacity=tw(lt,.2,.7);b.style.opacity=tw(lt,2.2,2.6);b.style.transform=`scale(${(.7+.3*E.ob(clamp((lt-2.2)/.6)))*(1+.03*Math.sin(lt*6)*(lt>3?1:0))})`}});
// ---------- кадр ----------
function sceneAt(t){let s=TL.scenes.find(x=>t>=x.t0&&t<x.t0+x.dur);return s||TL.scenes[TL.scenes.length-1]}
window.seek=function(t){const s=sceneAt(t),lt=t-s.t0,dur=s.dur;
for(const k in S)S[k].r.style.display=(k===s.name)?'block':'none';
const sc=S[s.name];sc.upd(lt,dur);
const ein=tw(lt,0,.4),eout=1-tw(lt,dur-.3,dur,E.io);const o=Math.min(ein,eout);
if(s.name!='twist')sc.r.style.transform=`translateY(${px((1-E.oc(clamp(lt/.5)))*40)}px) scale(${px(1+.05*(1-eout)+.02*lt/dur)})`;
sc.r.style.opacity=o;sc.r.style.filter=`blur(${px((1-o)*12)}px)`;
b1.style.transform=`translate(${px(-200+Math.sin(t*.5)*160)}px,${px(100+Math.cos(t*.4)*120)}px)`;b2.style.transform=`translate(${px(500+Math.cos(t*.45)*180)}px,${px(900+Math.sin(t*.5)*150)}px)`;b3.style.transform=`translate(${px(100+Math.sin(t*.6)*200)}px,${px(1300+Math.cos(t*.35)*120)}px)`;
document.getElementById('grid').style.backgroundPosition=`0 ${px(t*30%90)}px`;document.getElementById('grain').style.transform=`translate(${(Math.floor(t*24)*37)%90}px,${(Math.floor(t*24)*53)%90}px)`;
document.getElementById('hudfill').style.width=px(100*t/TL.dur)+'%';
// субтитры (пословно)
const sb=document.getElementById('subs');const cur=(TL.subs||[]).find(c=>t>=c[0]&&t<=c[1]);
if(cur){const ws=cur[2].split(' ');const wgt=ws.map(w=>Math.max(1,(w.match(/[аеёиоуыэюя]/gi)||[]).length));const tot=wgt.reduce((a,b)=>a+b,0);let acc=0,idx=0;const u=(t-cur[0])/(cur[1]-cur[0]);for(let i=0;i<ws.length;i++){if(u>=acc/tot)idx=i;acc+=wgt[i]}
sb.innerHTML='<span class="sp">'+ws.map((w,i)=>'<span style="color:'+(i==idx?'#ffc83d':'#fff')+';display:inline-block;margin:0 7px;text-shadow:'+(i==idx?'0 0 24px rgba(255,200,60,.7)':'none')+'">'+w+'</span>').join(' ')+'</span>'}else sb.innerHTML='';
}
</script></body></html>
