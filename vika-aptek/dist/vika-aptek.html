<title>Аптека: старт</title>
<style>
/* ===== Темы ===== */
:root {
  --bg: #f6f7f5;
  --surface: #ffffff;
  --surface-2: #eef2ef;
  --text: #1d2521;
  --muted: #5d6a63;
  --line: #d9e0dc;
  --accent: #2f7d62;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe6;
  --warn: #9a5b00;
  --warn-soft: #fff1d6;
  --danger: #b3261e;
  --danger-soft: #fde4e1;
  --ok: #2c7a3f;
  --ok-soft: #dff3e3;
  --info-soft: #e3edfb;
  --info: #24548f;
  --shadow: 0 1px 2px rgba(20, 40, 30, .06), 0 4px 14px rgba(20, 40, 30, .06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614;
    --surface: #1b211e;
    --surface-2: #232b27;
    --text: #e6ece8;
    --muted: #9fada6;
    --line: #34403a;
    --accent: #6cc7a1;
    --accent-ink: #0d1a14;
    --accent-soft: #1f3a2f;
    --warn: #f0b85a;
    --warn-soft: #3a2e17;
    --danger: #ff8a80;
    --danger-soft: #3d1f1d;
    --ok: #7fd28f;
    --ok-soft: #1c3423;
    --info-soft: #1c2a3d;
    --info: #9cc1f0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614;
  --surface: #1b211e;
  --surface-2: #232b27;
  --text: #e6ece8;
  --muted: #9fada6;
  --line: #34403a;
  --accent: #6cc7a1;
  --accent-ink: #0d1a14;
  --accent-soft: #1f3a2f;
  --warn: #f0b85a;
  --warn-soft: #3a2e17;
  --danger: #ff8a80;
  --danger-soft: #3d1f1d;
  --ok: #7fd28f;
  --ok-soft: #1c3423;
  --info-soft: #1c2a3d;
  --info: #9cc1f0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

/* ===== База ===== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: 84px;
}
h1, h2, h3 { line-height: 1.25; margin: 1.1em 0 .5em; }
h1 { font-size: 1.5rem; margin-top: .4em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.08rem; }
p { margin: .5em 0 .8em; }
ul, ol { padding-left: 1.3em; margin: .4em 0 .9em; }
li { margin: .25em 0; }
a { color: var(--accent); }
small, .muted { color: var(--muted); }
code { background: var(--surface-2); padding: 0 .3em; border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { border-bottom: 1px solid var(--line); padding: .5em .45em; text-align: left; vertical-align: top; }
th { background: var(--surface-2); }
.table-wrap { overflow-x: auto; margin: .6em 0 1em; border: 1px solid var(--line); border-radius: 10px; }
.table-wrap table { min-width: 520px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ===== Каркас ===== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar .brand { font-weight: 700; flex: 1; font-size: 1.05rem; text-decoration: none; color: var(--text); }
.topbar .brand span { color: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 8px 16px 24px; }
.view { animation: fadeIn .25s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 60px; font-size: .74rem; color: var(--muted); text-decoration: none; gap: 2px;
}
.bottomnav a svg { width: 24px; height: 24px; }
.bottomnav a.active { color: var(--accent); font-weight: 600; }

/* ===== Плашки-напоминания ===== */
.notices { display: grid; gap: 6px; margin: 8px 0 12px; }
.notice {
  border-radius: 10px; padding: 7px 10px; font-size: .8rem; line-height: 1.4;
  border: 1px solid var(--line);
}
.notice.model { background: var(--info-soft); color: var(--text); border-color: transparent; }
.notice.med { background: var(--warn-soft); color: var(--text); border-color: transparent; }
.notice b { margin-right: 4px; }
.notice.model b { color: var(--info); }
.notice.med b { color: var(--warn); }

/* ===== Карточки, кнопки ===== */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin: 12px 0; box-shadow: var(--shadow);
}
.card h2:first-child, .card h3:first-child { margin-top: .1em; }
.grid { display: grid; gap: 12px; }
@media (min-width: 560px) { .grid.two { grid-template-columns: 1fr 1fr; } }
.tile {
  display: block; text-decoration: none; color: var(--text);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow);
  transition: transform .15s ease;
}
.tile:active { transform: scale(.98); }
.tile .t { font-weight: 650; display: block; }
.tile .d { color: var(--muted); font-size: .9rem; }
.tile .badge { float: right; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 10px 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: transform .12s ease, opacity .12s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: .92rem; }
.btn.icon { min-width: 44px; min-height: 44px; padding: 0; border-radius: 50%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

.badge {
  display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: var(--surface-2); color: var(--muted);
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }

.box { border-radius: 12px; padding: 10px 14px; margin: .8em 0; }
.box.remember { background: var(--accent-soft); }
.box.important { background: var(--danger-soft); }
.box.check { background: var(--warn-soft); }
.box > b:first-child { display: block; margin-bottom: 2px; }
.verify { color: var(--warn); font-weight: 600; font-size: .9em; white-space: normal; }

.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transform-origin: left; transition: transform .4s ease; }

/* ===== Формы ===== */
label { display: block; font-weight: 600; font-size: .92rem; margin: .7em 0 .25em; }
input[type=text], input[type=search], input[type=number], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.check-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-weight: 400; margin: 0; cursor: pointer; }
.check-row input { width: 24px; height: 24px; flex: none; margin-top: 1px; accent-color: var(--accent); }

/* ===== Тесты ===== */
.q { margin: 0 0 6px; font-weight: 650; }
.opts { display: grid; gap: 8px; margin: 10px 0; }
.opt {
  text-align: left; min-height: 52px; padding: 10px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
  transition: transform .12s ease;
}
.opt:active { transform: scale(.98); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt[disabled] { cursor: default; }
.explain { border-radius: 12px; padding: 10px 14px; background: var(--surface-2); animation: fadeIn .2s ease both; }

/* ===== Карточки Лейтнера ===== */
.flash { perspective: 1000px; margin: 12px 0; }
.flash-inner {
  position: relative; min-height: 230px; transition: transform .45s ease; transform-style: preserve-3d;
}
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; display: flex; flex-direction: column; justify-content: center; overflow: auto;
}
.flash-face.back { transform: rotateY(180deg); }
.flash-face .big { font-size: 1.35rem; font-weight: 700; text-align: center; }

/* ===== Схемы SVG ===== */
.schema { margin: .8em 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.schema svg { width: 100%; height: auto; display: block; }
.s-box { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
.s-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.s-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; }
.s-bad { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.5; }
.s-line { stroke: var(--muted); stroke-width: 2; fill: none; }
.s-txt { fill: var(--text); font: 13px system-ui, sans-serif; }
.s-sm { fill: var(--muted); font: 11px system-ui, sans-serif; }
.s-b { font-weight: 700; }
.s-arrow { fill: var(--muted); }

/* ===== Тренажёр ===== */
.pos { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
.pos-head { background: var(--surface-2); padding: 8px 12px; font-size: .85rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.pos-body { padding: 12px; }
.pos .result {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 6px 0; cursor: pointer;
  background: var(--surface); color: var(--text); width: 100%; text-align: left; font: inherit;
}
.pos .result.sel { border-color: var(--accent); background: var(--accent-soft); }
.pos .line { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.pos .total { font-weight: 700; font-size: 1.1rem; text-align: right; padding: 8px 0; }
.lot { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.lot.expired { color: var(--danger); }
.task { border-left: 4px solid var(--accent); }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin: 8px 0; animation: fadeIn .2s ease both; }
.err { background: var(--danger-soft); border-radius: 10px; padding: 8px 12px; margin: 8px 0; animation: fadeIn .2s ease both; }
.okmsg { background: var(--ok-soft); border-radius: 10px; padding: 8px 12px; margin: 8px 0; animation: fadeIn .2s ease both; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ===== Диалоги-сценарии ===== */
.bubble { max-width: 88%; padding: 10px 14px; border-radius: 16px; margin: 8px 0; animation: fadeIn .2s ease both; }
.bubble.them { background: var(--surface-2); border-bottom-left-radius: 4px; }
.bubble.me { background: var(--accent-soft); margin-left: auto; border-bottom-right-radius: 4px; }

/* ===== Тост ===== */
.toast {
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 50;
  max-width: calc(100% - 32px); animation: fadeIn .2s ease both; font-size: .95rem;
}

/* ===== Глоссарий ===== */
dl.gloss dt { font-weight: 700; margin-top: .8em; }
dl.gloss dd { margin: .1em 0 0; color: var(--text); }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; margin: 8px 0; }
details summary { cursor: pointer; font-weight: 650; min-height: 36px; display: flex; align-items: center; }
details[open] summary { margin-bottom: 6px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ===== Печать ===== */
@media print {
  .topbar, .bottomnav, .no-print, .toast { display: none !important; }
  body { background: #fff; color: #000; padding: 0; font-size: 12pt; }
  main { max-width: none; padding: 0; }
  .card { box-shadow: none; border: 1px solid #999; break-inside: avoid; }
  .notice { border: 1px solid #999; background: #fff !important; }
  a { color: #000; text-decoration: none; }
}
</style>

</script>

<main id="app" tabindex="-1">

<script>
/* Хранилище: всё только в localStorage этого браузера. Любой доступ обёрнут в try/catch. */
(function () {
  'use strict';
  var KEY = 'vika-aptek-v1';
  var THEME_KEY = 'vika-aptek-theme';
  var available = true;

  function defaults() {
    return {
      version: 1,
      lessons: {},      // id урока -> { best: число верных, total, done: true }
      groups: {},       // id группы -> { best, total }
      wrong: {},        // id вопроса -> true (для «повтора ошибок»)
      cards: {},        // id карточки -> { box: 1..5, due: 'ГГГГ-ММ-ДД' }
      cardLog: {},      // 'ГГГГ-ММ-ДД' -> сколько карточек повторено
      cardGoal: 20,
      cardSource: 'all',
      plan: {},         // 'd3-1' -> true
      trainer: {},      // id сценария -> { hints: лучший результат, nohints: лучший результат }
      scen: {},         // id диалога -> true, если пройден
      notes: [],        // { id, text, created, updated }
      questions: [],    // { id, text, answer, done, created }
      assort: []        // «Мой ассортимент»
    };
  }

  var data = defaults();
  try {
    var raw = window.localStorage.getItem(KEY);
    if (raw) data = merge(defaults(), JSON.parse(raw));
  } catch (e) {
    available = false;
  }

  function merge(base, extra) {
    if (!extra || typeof extra !== 'object') return base;
    Object.keys(base).forEach(function (k) {
      if (!(k in extra)) return;
      var b = base[k], x = extra[k];
      if (Array.isArray(b)) { if (Array.isArray(x)) base[k] = x; }
      else if (b && typeof b === 'object') { if (x && typeof x === 'object' && !Array.isArray(x)) base[k] = x; }
      else if (typeof x === typeof b) base[k] = x;
    });
    return base;
  }

  function save() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      available = false;
      return false;
    }
  }

  function today(offsetDays) {
    var d = new Date();
    if (offsetDays) d.setDate(d.getDate() + offsetDays);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function exportObject() {
    return { app: 'vika-aptek', exported: new Date().toISOString(), data: data };
  }

  function importObject(obj) {
    if (!obj || obj.app !== 'vika-aptek' || !obj.data || typeof obj.data !== 'object') {
      throw new Error('Это не файл резервной копии этого сайта.');
    }
    data = merge(defaults(), obj.data);
    return save();
  }

  function reset() {
    data = defaults();
    return save();
  }

  function getTheme() {
    try { return window.localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
  }
  function setTheme(t) {
    try {
      if (t === 'auto') window.localStorage.removeItem(THEME_KEY);
      else window.localStorage.setItem(THEME_KEY, t);
    } catch (e) { /* тема просто не запомнится */ }
  }

  /* ---- CSV (разделитель «;», чтобы Excel в русской локали открывал по столбцам) ---- */
  function csvEscape(v) {
    v = v == null ? '' : String(v);
    if (/[";\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function toCSV(rows, cols) {
    var out = [cols.map(function (c) { return csvEscape(c.title); }).join(';')];
    rows.forEach(function (r) {
      out.push(cols.map(function (c) { return csvEscape(r[c.key]); }).join(';'));
    });
    return '﻿' + out.join('\r\n');
  }
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    var firstLine = text.split(/\r?\n/)[0] || '';
    var sep = (firstLine.split(';').length >= firstLine.split(',').length) ? ';' : ',';
    var rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
        } else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {

    },
    open: function (pid) { S.sel = pid; emit({ type: 'open', pid: pid }); draw(); },
    add: function (pid, lot, qty) {
      var p = prod(S, pid);
      qty = Math.max(1, parseInt(qty, 10) || 1);
      if (!lot) { S.msg = { kind: 'err', text: 'Выберите партию.' }; draw(); return; }
      if (p.rx) { S.dialog = { kind: 'rx', pid: pid, lot: lot, qty: qty }; S.msg = null; draw(); return; }
      if (emit({ type: 'add', pid: pid, lot: lot, qty: qty })) {
        var ex = S.cart.filter(function (l) { return l.pid === pid && l.lot === lot; })[0];
        if (ex) ex.qty += qty; else S.cart.push({ pid: pid, lot: lot, qty: qty, scans: 0, price: p.price });
      }
      draw();
    },
    qty: function (i, d) {
      var l = S.cart[i]; if (!l) return;
      var nq = l.qty + d;
      if (nq < 1) return;
      if (d > 0 && !emit({ type: 'add', pid: l.pid, lot: l.lot, qty: d })) { draw(); return; }
      l.qty = nq; if (l.scans > l.qty) l.scans = l.qty;
      draw();
    },
    remove: function (i) { var l = S.cart[i]; if (!l) return; emit({ type: 'remove', pid: l.pid }); S.cart.splice(i, 1); S.msg = S.msg || (S.hints ? { kind: 'hint', text: 'Позиция отменена (чек ещё не закрыт — так можно). В некоторых аптеках на это нужно подтверждение старшего.' } : null); draw(); },
    scan: function (i) {
      var l = S.cart[i]; if (!l) return;
      if (S.scanFailOnce) { S.scanFailOnce = false; S.dialog = { kind: 'scanfail', line: i }; S.msg = null; draw(); return; }
      if (l.scans < l.qty) { l.scans++; emit({ type: 'scan', ok: true, pid: l.pid }); }
      draw();
    },
    report: function (pid, lot) {
      S.reported[pid + lot] = true;
      emit({ type: 'report', pid: pid, lot: lot });
      draw();
    },
    choice: function (value) {
      var d = S.dialog; if (!d) return;
      var ok = emit({ type: 'choice', dialog: d.kind, value: value });
      if (d.kind === 'scanfail') {
        if (value === 'retry') { var l = S.cart[d.line]; if (l && l.scans < l.qty) { l.scans++; emit({ type: 'scan', ok: true, pid: l.pid }); } S.dialog = null; if (S.hints && !S.msg) S.msg = { kind: 'ok', text: 'Со второй попытки код считался. Если бы не считался — к старшему, по инструкции аптеки.' }; }
        else if (!S.hints || ok) { S.dialog = null; }
      } else if (d.kind === 'rx') {
        if (value === 'refuse') S.dialog = null;
        else if (!S.hints) S.dialog = null;
      }
      draw();
    },
    pay: function (method) {
      if (!S.cart.length) { S.msg = { kind: 'err', text: 'Чек пустой.' }; draw(); return; }
      if (scansMissing(S) > 0) { emit({ type: 'payblocked' }); S.msg = { kind: 'err', text: 'Касса (учебная): не все коды маркировки отсканированы. Оплата невозможна.' }; draw(); return; }
      if (!emit({ type: 'pay', method: method })) { draw(); return; }
      var lines = S.cart.map(function (l) { return { pid: l.pid, name: prod(S, l.pid).name, lot: l.lot, qty: l.qty, price: l.price }; });
      var no = String(S.nextNo++).padStart(4, '0');
      S.receipts.push({ no: no, pay: method, lines: lines });
      S.lastReceipt = { no: no, method: method, total: total(lines) };
      S.cart = []; S.sel = null; S.results = null; S.q = '';
      draw();
    },
    retSelect: function (no) {
      if (!emit({ type: 'retselect', no: no })) { draw(); return; }
      S.ret = { no: no, qty: {}, confirmed: false }; draw();
    },
    retDo: function (method) {
      var rc = S.receipts.filter(function (r) { return r.no === S.ret.no; })[0]; if (!rc) return;
      var q = 0; Object.keys(S.ret.qty).forEach(function (k) { q += S.ret.qty[k] || 0; });
      if (q === 0) { S.msg = { kind: 'err', text: 'Укажите количество к возврату.' }; draw(); return; }
      if (!emit({ type: 'retdo', no: rc.no, qty: q, method: method, confirmed: S.ret.confirmed })) { draw(); return; }
      S.lastReceipt = { no: 'В-' + rc.no, method: method, total: -rc.lines.reduce(function (a, l, i) { return a + (S.ret.qty[i] || 0) * l.price; }, 0), ret: true };
      S.ret = { no: null, qty: {}, confirmed: false };
      draw();
    },
    recvDo: function () {
      emit({ type: 'recv', answers: S.recv.answers, action: S.recv.action });
      draw();
    }
  };

  function total(lines) { return lines.reduce(function (a, l) { return a + l.qty * l.price; }, 0); }

  /* ---------- Отрисовка ---------- */
  function draw() {
    if (!host) return;
    var sc = S.sc, h = '';
    h += '<div class="card task"><div class="row"><h2 style="margin:0">' + esc(sc.title) + '</h2><span class="spacer"></span>' +
      '<span class="badge ' + (S.hints ? 'acc' : 'warn') + '">' + (sc.free ? 'песочница' : S.hints ? 'с подсказками' : 'без подсказок') + '</span></div>' +
      '<p><b>Ситуация:</b> ' + esc(sc.customer) + '</p>';
    if (S.hints && !sc.free) {
      var si = sc.step(S);
      h += '<ol class="steps">' + sc.steps.map(function (t, i) {
        return '<li style="' + (i < si ? 'opacity:.55;text-decoration:line-through' : i === si ? 'font-weight:700' : '') + '">' + esc(t) + '</li>';
      }).join('') + '</ol>';
    } else if (!sc.free) {
      h += '<p class="muted">Подсказок нет. Ошибки покажем в разборе после завершения.</p>';
    }
    if (S.msg) h += '<div class="' + (S.msg.kind === 'err' ? 'err' : S.msg.kind === 'ok' ? 'okmsg' : 'hint') + '" role="status">' + esc(S.msg.text) + '</div>';
    h += '</div>';

    if (S.done && !sc.free) {
      h += summary();
      host.innerHTML = h; bind(); return;
    }

    h += '<div class="pos"><div class="pos-head"><span>Учебная касса · вымышленные товары · цены в у.е.</span><span>' + fmtDate(dateIn(0)) + '</span></div><div class="pos-body">';
    h += '<div class="seg" role="tablist">' +
      tabBtn('sale', 'Продажа') + tabBtn('return', 'Возврат') + tabBtn('recv', 'Приёмка') + '</div>';
    if (S.tab === 'sale') h += drawSale();
    else if (S.tab === 'return') h += drawReturn();
    else h += drawRecv();
    h += '</div></div>';
    h += '<div class="row" style="margin-top:12px"><a class="btn small" href="#/trainer">← Все сценарии</a><span class="spacer"></span>' +
      '<button class="btn small ghost" data-act="restart">Начать заново</button></div>';
    host.innerHTML = h; bind();
  }

  function tabBtn(id, t) { return '<button class="btn small' + (S.tab === id ? ' on' : '') + '" data-act="tab" data-v="' + id + '" role="tab" aria-selected="' + (S.tab === id) + '">' + t + '</button>'; }

  function drawSale() {
    var h = '';
    if (S.dialog) h += drawDialog();
    if (S.lastReceipt) {
      h += '<div class="okmsg">' + (S.lastReceipt.ret ? 'Возврат оформлен' : 'Чек №' + S.lastReceipt.no + ' закрыт') + ': ' + (S.lastReceipt.method === 'card' ? 'карта' : 'наличные') + ', ' + S.lastReceipt.total + ' у.е.</div>';
    }
    h += '<label>Режим поиска</label><div class="seg">' +
      [['name', 'Название'], ['mnn', 'МНН'], ['bc', 'Штрихкод'], ['code', 'Код']].map(function (m) {
        return '<button class="btn small' + (S.mode === m[0] ? ' on' : '') + '" data-act="mode" data-v="' + m[0] + '">' + m[1] + '</button>';
      }).join('') + '</div>';
    h += '<form class="row" data-form="search" style="margin-top:8px"><input type="search" name="q" value="' + esc(S.q) + '" placeholder="' +
      (S.mode === 'bc' ? '13 цифр штрихкода' : S.mode === 'code' ? 'код товара' : '3–4 первые буквы') + '" aria-label="Поиск" style="flex:1;min-width:150px" autocomplete="off">' +
      '<button class="btn primary" type="submit">Найти</button></form>';
    if (S.results) {
      if (!S.results.length) h += '<p class="muted">Ничего не найдено. Проверьте режим поиска и написание.</p>';
      S.results.forEach(function (pid) {
        var p = prod(S, pid);
        var free = p.lots.filter(function (l) { return !isExpired(l); }).reduce(function (a, l) { return a + l.qty; }, 0);
        h += '<button class="result' + (S.sel === pid ? ' sel' : '') + '" data-act="open" data-v="' + pid + '"><b>' + esc(p.name) + '</b>' +
          (p.rx ? ' <span class="badge danger">Рецептурный</span>' : '') + (p.marked ? ' <span class="badge">маркировка</span>' : '') +
          '<br><small>МНН: ' + esc(p.mnn) + ' · ' + esc(p.maker) + ' · остаток ' + free + ' · ' + p.price + ' у.е.</small></button>';
      });
    }
    if (S.sel) {
      var p = prod(S, S.sel);
      h += '<div class="card" style="margin-top:10px"><h3>' + esc(p.name) + '</h3>' +
        '<div class="table-wrap"><table style="min-width:0"><tr><th>МНН</th><td>' + esc(p.mnn) + '</td></tr><tr><th>Форма</th><td>' + esc(p.form) + '</td></tr>' +
        '<tr><th>Дозировка</th><td>' + esc(p.dose) + '</td></tr><tr><th>Фасовка</th><td>' + esc(p.pack) + '</td></tr><tr><th>Производитель</th><td>' + esc(p.maker) + '</td></tr>' +
        '<tr><th>Штрихкод / код</th><td>' + p.bc + ' / ' + p.code + '</td></tr><tr><th>Отпуск</th><td>' + (p.rx ? '<b style="color:var(--danger)">по рецепту</b>' : 'без рецепта') + '</td></tr></table></div>' +
        '<b>Партии</b>';
      p.lots.forEach(function (l) {
        var exp = isExpired(l);
        h += '<label class="lot' + (exp ? ' expired' : '') + '" style="font-weight:400;margin:0"><input type="radio" name="lot" value="' + l.lot + '"> ' +
          '<span style="flex:1">' + l.lot + ' · годен до ' + fmtDate(l.exp) + ' · ' + l.qty + ' шт.' + (exp ? ' · <b>СРОК ИСТЁК</b>' : '') + '</span>' +
          (exp ? (S.reported[p.id + l.lot] ? '<span class="badge ok">сообщено</span>' : '<button type="button" class="btn small danger" data-act="report" data-v="' + l.lot + '">Сообщить старшему</button>') : '') +
          '</label>';
      });
      h += '<div class="row" style="margin-top:10px"><label for="qtyIn" style="margin:0">Кол-во</label><input id="qtyIn" type="number" min="1" value="1" inputmode="numeric" style="width:90px">' +
        '<button class="btn primary" data-act="add">Добавить в чек</button></div></div>';
    }
    // чек
    h += '<h3>Чек</h3>';
    if (!S.cart.length) h += '<p class="muted">Пусто.</p>';
    S.cart.forEach(function (l, i) {
      var p = prod(S, l.pid);
      h += '<div class="line"><div><b>' + esc(p.name) + '</b><br><small>партия ' + l.lot + ' · ' + l.price + ' у.е.</small>' +
        (p.marked ? '<br><small>Коды маркировки: <b>' + l.scans + ' / ' + l.qty + '</b></small>' : '') + '</div>' +
        '<div style="text-align:right"><div class="row end"><button class="btn small icon" data-act="qty" data-i="' + i + '" data-v="-1" aria-label="Меньше">−</button><b>' + l.qty + '</b>' +
        '<button class="btn small icon" data-act="qty" data-i="' + i + '" data-v="1" aria-label="Больше">+</button></div></div>' +
        '<div class="row" style="grid-column:1/-1">' + (p.marked && l.scans < l.qty ? '<button class="btn small primary" data-act="scan" data-i="' + i + '">Сканировать код маркировки</button>' : '') +
        '<button class="btn small danger" data-act="remove" data-i="' + i + '">Отменить позицию</button></div></div>';
    });
    h += '<div class="total">Итого: ' + total(S.cart) + ' у.е.</div>';
    h += '<div class="row"><button class="btn primary" style="flex:1" data-act="pay" data-v="cash"' + (S.cart.length ? '' : ' disabled') + '>Оплата: наличные</button>' +
      '<button class="btn primary" style="flex:1" data-act="pay" data-v="card"' + (S.cart.length ? '' : ' disabled') + '>Оплата: карта</button></div>';
    return h;
  }

  function drawDialog() {
    var d = S.dialog, h = '<div class="card" role="dialog" aria-label="Вопрос" style="border:2px solid var(--warn)">';
    if (d.kind === 'scanfail') {
      h += '<h3>Код маркировки не считывается</h3><p>Сканер не прочитал код с упаковки. Что делаете?</p><div class="opts">' +
        '<button class="opt" data-act="choice" data-v="retry">Протереть окно сканера, развернуть упаковку, убрать блики и попробовать ещё раз; если не выйдет — позвать старшего</button>' +
        '<button class="opt" data-act="choice" data-v="other">Отсканировать код с другой такой же упаковки с полки</button>' +
        '<button class="opt" data-act="choice" data-v="skip">Продать без сканирования, чтобы не задерживать очередь</button></div>';
    } else if (d.kind === 'rx') {
      h += '<h3>Препарат отпускается по рецепту</h3><p>Учебная касса спрашивает: есть ли рецепт? Покупатель говорит, что рецепта нет.</p><div class="opts">' +
        '<button class="opt" data-act="choice" data-v="refuse">Вежливо объяснить, что без рецепта отпустить нельзя, и предложить обратиться к врачу</button>' +
        '<button class="opt" data-act="choice" data-v="sell">Продать, раз покупатель давно его принимает</button>' +
        '<button class="opt" data-act="choice" data-v="analog">Предложить «похожий» препарат вместо него</button></div>';
    }
    return h + '</div>';
  }

  function drawReturn() {
    var h = '';
    if (S.lastReceipt && S.lastReceipt.ret) h += '<div class="okmsg">Возврат оформлен: ' + (S.lastReceipt.method === 'card' ? 'на карту' : 'наличными') + ', ' + S.lastReceipt.total + ' у.е.</div>';
    h += '<p class="muted">Учебная модель. В реальной аптеке возврат оформляется по инструкции и, как правило, со старшим.</p>';
    if (!S.ret.no) {
      h += '<b>Закрытые чеки смены</b>';
      S.receipts.slice().reverse().forEach(function (r) {
        h += '<button class="result" data-act="retsel" data-v="' + r.no + '"><b>Чек №' + r.no + '</b> · ' + (r.pay === 'card' ? 'карта' : 'наличные') + ' · ' + total(r.lines) + ' у.е.<br><small>' +
          r.lines.map(function (l) { return esc(l.name) + ' × ' + l.qty; }).join('; ') + '</small></button>';
      });
      return h;
    }
    var rc = S.receipts.filter(function (r) { return r.no === S.ret.no; })[0];
    h += '<h3>Возврат по чеку №' + rc.no + '</h3><p>Оплата: <b>' + (rc.pay === 'card' ? 'карта' : 'наличные') + '</b></p>';
    rc.lines.forEach(function (l, i) {
      h += '<div class="line"><div><b>' + esc(l.name) + '</b><br><small>в чеке: ' + l.qty + ' шт.</small></div><div><label for="rq' + i + '" class="sr-only">Вернуть</label>' +
        '<input id="rq' + i + '" data-retq="' + i + '" type="number" min="0" max="' + l.qty + '" value="' + (S.ret.qty[i] || 0) + '" style="width:80px" inputmode="numeric"></div></div>';
    });
    h += '<label class="check-row"><input type="checkbox" id="retConf"' + (S.ret.confirmed ? ' checked' : '') + '> Старший подтвердил возврат</label>';
    h += '<div class="row"><button class="btn primary" style="flex:1" data-act="retdo" data-v="cash">Вернуть наличными</button><button class="btn primary" style="flex:1" data-act="retdo" data-v="card">Вернуть на карту</button></div>' +
      '<button class="btn small ghost" data-act="retback" style="margin-top:8px">← К списку чеков</button>';
    return h;
  }

  var RECV = [
    { id: 'r1', inv: 'Термоглин 250 мг таблетки №20 — 10 уп.', fact: 'Термоглин 250 мг таблетки №20 — 8 уп.' },
    { id: 'r2', inv: '— (нет в накладной)', fact: 'Термоглин 500 мг таблетки №20 — 2 уп.' },
    { id: 'r3', inv: 'Носолин 0,1% спрей 10 мл — 5 уп.', fact: 'Носолин 0,1% спрей 10 мл — 5 уп.' },
    { id: 'r4', inv: 'Горлодин таблетки №24 — 6 уп.', fact: 'Горлодин таблетки №24 — 6 уп., из них 1 с порванной упаковкой' }
  ];
  function drawRecv() {
    var h = '<p class="muted">Учебная сверка. Реальную приёмку оформляет ответственный по инструкции аптеки.</p>';
    var opts = [['', '— выберите —'], ['ok', 'Совпадает'], ['short', 'Недостача'], ['excess', 'Излишек'], ['resort', 'Пересорт'], ['defect', 'Брак']];
    RECV.forEach(function (r) {
      h += '<div class="card" style="margin:8px 0;padding:10px 12px"><small class="muted">Накладная:</small> ' + esc(r.inv) + '<br><small class="muted">Факт:</small> <b>' + esc(r.fact) + '</b>' +
        '<label for="rv-' + r.id + '">Статус</label><select id="rv-' + r.id + '" data-recv="' + r.id + '">' +
        opts.map(function (o) { return '<option value="' + o[0] + '"' + (S.recv.answers[r.id] === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>';
    });
    h += '<b>Что делать с расхождениями?</b><div class="opts">' +
      [['hold', 'Отложить спорный товар, не выставлять в продажу, сообщить ответственному для оформления акта'], ['fix', 'Самой исправить количество в программе, чтобы сошлось'], ['sell', 'Выставить всё в продажу, разберёмся потом']].map(function (o) {
        return '<label class="check-row" style="border:1px solid var(--line);border-radius:10px;padding:10px"><input type="radio" name="recvAct" value="' + o[0] + '"' + (S.recv.action === o[0] ? ' checked' : '') + '> ' + o[1] + '</label>';
      }).join('') + '</div><button class="btn primary block" data-act="recvdo">Завершить сверку</button>';
    return h;
  }

  function summary() {
    var n = S.errors.length, score = Math.max(0, 100 - n * 25);
    var h = '<div class="card"><h2>' + (n === 0 ? 'Готово без ошибок!' : 'Сценарий завершён') + '</h2>' +
      '<p>Результат: <b>' + score + ' / 100</b> · ошибок: ' + n + '</p>' +
      '<div class="progress" aria-hidden="true"><i style="transform:scaleX(' + (score / 100) + ')"></i></div>';
    if (n) {
      h += '<h3>Разбор ошибок</h3><ol>' + S.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ol>';
    } else {
      h += '<p>Вы сделали всё по порядку. ' + (S.hints ? 'Попробуйте теперь режим «без подсказок».' : 'Отличная самопроверка!') + '</p>';
    }
    h += '<div class="row"><button class="btn primary" data-act="restart">Ещё раз</button>' +
      (S.hints ? '<a class="btn" href="#/trainer/' + S.sc.id + '/nohints">Без подсказок</a>' : '<a class="btn" href="#/trainer/' + S.sc.id + '/hints">С подсказками</a>') +
      '<a class="btn ghost" href="#/trainer">Все сценарии</a></div></div>';
    if (onFinish) { var cb = onFinish; onFinish = null; cb(S.sc.id, S.hints ? 'hints' : 'nohints', score); }
    return h;
  }

  function bind() {
    host.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        var a = b.getAttribute('data-act'), v = b.getAttribute('data-v'), i = parseInt(b.getAttribute('data-i'), 10);
        if (a === 'tab') act.tab(v);
        else if (a === 'mode') act.mode(v);
        else if (a === 'open') act.open(v);
        else if (a === 'add') {
          var r = host.querySelector('input[name=lot]:checked');
          act.add(S.sel, r ? r.value : null, host.querySelector('#qtyIn').value);
        }
        else if (a === 'report') { e.preventDefault(); act.report(S.sel, v); }
        else if (a === 'qty') act.qty(i, parseInt(v, 10));
        else if (a === 'remove') act.remove(i);
        else if (a === 'scan') act.scan(i);
        else if (a === 'choice') act.choice(v);
        else if (a === 'pay') act.pay(v);
        else if (a === 'retsel') act.retSelect(v);
        else if (a === 'retback') { S.ret = { no: null, qty: {}, confirmed: false }; draw(); }
        else if (a === 'retdo') act.retDo(v);
        else if (a === 'recvdo') act.recvDo();
        else if (a === 'restart') start(host, S.sc.id, S.hints ? 'hints' : 'nohints', onFinishSaved);
      });
    });
    var f = host.querySelector('[data-form=search]');
    if (f) f.addEventListener('submit', function (e) { e.preventDefault(); act.search(f.q.value); });
    host.querySelectorAll('[data-retq]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var i = inp.getAttribute('data-retq'), max = parseInt(inp.max, 10);
        S.ret.qty[i] = Math.min(max, Math.max(0, parseInt(inp.value, 10) || 0));
      });
    });
    var rc = host.querySelector('#retConf');
    if (rc) rc.addEventListener('change', function () { S.ret.confirmed = rc.checked; });
    host.querySelectorAll('[data-recv]').forEach(function (sel) {
      sel.addEventListener('change', function () { S.recv.answers[sel.getAttribute('data-recv')] = sel.value; });
    });
    host.querySelectorAll('input[name=recvAct]').forEach(function (r) {
      r.addEventListener('change', function () { S.recv.action = r.value; });
    });
  }

  var onFinishSaved = null;
  window.VA.trainer = {
    scenarios: SCEN.map(function (s) { return { id: s.id, title: s.title, desc: s.desc, free: !!s.free }; }),
    start: function (el, id, mode, cb) { onFinishSaved = cb; start(el, id, mode, cb); }
  };
})();
</script>
<script>
/* Приложение: роутер и экраны. */
(function () {
  'use strict';
  var VA = window.VA, store = VA.store, D = function () { return store.data; };
  var app = document.getElementById('app');

  /* ---------- Утилиты ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(sel, root) { return (root || app).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || app).querySelectorAll(sel)); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function bar(a, b) { return '<div class="progress" aria-label="' + pct(a, b) + '%"><i style="transform:scaleX(' + (b ? a / b : 0) + ')"></i></div>'; }
  function save() { if (!store.save()) toast('Не удалось сохранить: хранилище браузера недоступно. Сделайте резервную копию.'); }
  var toastTimer;
  function toast(t) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t;
    document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.remove(); }, 2600);
  }
  function notices() {
    return '<div class="notices">' +
      '<div class="notice model"><b>Учебная модель.</b>В вашей аптеке окна и кнопки могут отличаться. Сверяйтесь с инструкцией работодателя и наставником.</div>' +
      '<div class="notice med"><b>Напоминание.</b>Фармацевт не ставит диагнозов и не назначает лечение. При тревожных симптомах, у беременных, детей и пожилых — направляйте к врачу. Дозировки и применение берутся из инструкции к препарату и назначения врача.</div>' +
      '</div>';
  }
  function page(title, body, opts) {
    opts = opts || {};
    var back = opts.back ? '<a class="btn small ghost no-print" href="' + opts.back + '">← Назад</a>' : '';
    return '<div class="view">' + back + '<h1>' + title + '</h1>' + notices() + body + '</div>';
  }
  function lessonById(id) { return VA.lessons.filter(function (l) { return l.id === id; })[0]; }
  function groupById(id) { return VA.groups.filter(function (g) { return g.id === id; })[0]; }

  /* ---------- Вопросы ---------- */
  function allQuestions() {
    var out = [];
    VA.lessons.forEach(function (l) { l.quiz.forEach(function (q, i) { out.push(Object.assign({ id: 'L:' + l.id + ':' + i, src: l.title }, q)); }); });
    VA.groups.forEach(function (g) { g.quiz.forEach(function (q, i) { out.push(Object.assign({ id: 'G:' + g.id + ':' + i, src: g.title }, q)); }); });
    return out;
  }
  function withIds(list, prefix, src) { return list.map(function (q, i) { return Object.assign({ id: prefix + i, src: src }, q); }); }

  /* Тест: по одному вопросу, объяснение после ответа. */
  function quiz(el, questions, onDone) {
    var idx = 0, right = 0, wrongList = [];
    var qs = questions.map(function (q) {
      var order = shuffle(q.a.map(function (_, i) { return i; }));
      return Object.assign({}, q, { order: order });
    });
    function show() {
      if (idx >= qs.length) return finish();
      var q = qs[idx];
      el.innerHTML = '<div class="card"><div class="row"><small class="muted">Вопрос ' + (idx + 1) + ' из ' + qs.length + (q.src ? ' · ' + esc(q.src) : '') + '</small></div>' +
        bar(idx, qs.length) + '<p class="q" style="margin-top:10px">' + esc(q.q) + '</p><div class="opts">' +
        q.order.map(function (i) { return '<button class="opt" data-i="' + i + '">' + esc(q.a[i]) + '</button>'; }).join('') +
        '</div><div class="fb"></div></div>';
      $$('.opt', el).forEach(function (b) {
        b.addEventListener('click', function () {
          var i = parseInt(b.getAttribute('data-i'), 10), ok = i === q.c;
          $$('.opt', el).forEach(function (o) {
            o.disabled = true;
            var oi = parseInt(o.getAttribute('data-i'), 10);
            if (oi === q.c) o.classList.add('right'); else if (oi === i) o.classList.add('wrong');
          });
          if (ok) { right++; delete D().wrong[q.id]; } else { D().wrong[q.id] = true; wrongList.push(q); }
          save();
          $('.fb', el).innerHTML = '<div class="explain"><b>' + (ok ? 'Верно.' : 'Не совсем.') + '</b> ' + esc(q.e) + '</div>' +
            '<div class="row end" style="margin-top:10px"><button class="btn primary next">' + (idx + 1 < qs.length ? 'Дальше' : 'Результат') + '</button></div>';
          var nb = $('.next', el); nb.addEventListener('click', function () { idx++; show(); }); nb.focus();
        });
      });
    }
    function finish() {
      el.innerHTML = '<div class="card"><h2>Результат: ' + right + ' из ' + qs.length + '</h2>' + bar(right, qs.length) +
        (wrongList.length ? '<h3>Повторите</h3><ul>' + wrongList.map(function (q) { return '<li><b>' + esc(q.q) + '</b><br>Ответ: ' + esc(q.a[q.c]) + '. <span class="muted">' + esc(q.e) + '</span></li>'; }).join('') + '</ul>' : '<p>Все ответы верные!</p>') +
        '<div class="row"><button class="btn primary again">Пройти ещё раз</button></div></div>';
      $('.again', el).addEventListener('click', function () { idx = 0; right = 0; wrongList = []; qs = shuffle(qs); show(); });
      if (onDone) onDone(right, qs.length);
    }
    show();
  }

  /* ---------- Экраны ---------- */
  var routes = {};

  routes[''] = function () {
    var d = D();
    var lessonsDone = VA.lessons.filter(function (l) { return d.lessons[l.id] && d.lessons[l.id].done; }).length;
    var groupsDone = VA.groups.filter(function (g) { return d.groups[g.id]; }).length;
    var trDone = VA.trainer.scenarios.filter(function (s) { return !s.free && d.trainer[s.id]; }).length;
    var trTotal = VA.trainer.scenarios.filter(function (s) { return !s.free; }).length;
    var planTotal = 0, planDone = 0, curDay = null;
    VA.plan.forEach(function (day) {
      day.tasks.forEach(function (t, i) { planTotal++; if (d.plan['d' + day.day + '-' + i]) planDone++; });
      if (!curDay && day.tasks.some(function (t, i) { return !d.plan['d' + day.day + '-' + i]; })) curDay = day;
    });
    var due = cardDeck().filter(isDue).length;
    var todayCount = d.cardLog[store.today()] || 0;
    var h = '<p>Привет, Вика! Здесь — короткие уроки, тренажёр кассы и карточки, чтобы за 2–3 недели уверенно работать за кассой и в зале. По 20–30 минут в день достаточно.</p>';
    if (!store.isAvailable()) h += '<div class="box important"><b>Хранилище недоступно</b>Браузер не даёт сохранять прогресс (например, приватный режим). Всё работает, но после закрытия вкладки прогресс пропадёт.</div>';
    if (curDay) {
      h += '<div class="card"><div class="row"><h2 style="margin:0">День ' + curDay.day + ': ' + esc(curDay.theme) + '</h2><span class="spacer"></span><a class="btn small" href="#/plan">План</a></div><ul style="list-style:none;padding:0">' +
        curDay.tasks.map(function (t, i) {
          var k = 'd' + curDay.day + '-' + i;
          return '<li><label class="check-row"><input type="checkbox" data-plan="' + k + '"' + (d.plan[k] ? ' checked' : '') + '> <span><a href="' + t.link + '">' + esc(t.t) + '</a></span></label></li>';
        }).join('') + '</ul></div>';
    } else {
      h += '<div class="card"><h2>План на 14 дней выполнен 🎉</h2><p>Продолжайте карточки и пополняйте «Мой ассортимент».</p></div>';
    }
    h += '<div class="card"><h2>Прогресс</h2>' +
      '<p>Уроки 1С: ' + lessonsDone + ' из ' + VA.lessons.length + '</p>' + bar(lessonsDone, VA.lessons.length) +
      '<p>Тесты по группам ассортимента: ' + groupsDone + ' из ' + VA.groups.length + '</p>' + bar(groupsDone, VA.groups.length) +
      '<p>Сценарии тренажёра: ' + trDone + ' из ' + trTotal + '</p>' + bar(trDone, trTotal) +
      '<p>План: ' + planDone + ' из ' + planTotal + '</p>' + bar(planDone, planTotal) +
      '<p>Карточки сегодня: ' + todayCount + ' из ' + d.cardGoal + ' · к повтору: ' + due + '</p>' + bar(Math.min(todayCount, d.cardGoal), d.cardGoal) + '</div>';
    h += '<div class="grid two">' +
      tile('#/trainer', 'Тренажёр «Касса»', 'Найти товар, пробить чек, возврат, сроки, пересорт') +
      tile('#/cards', 'Карточки', 'Препарат → МНН, группа, форма') +
      tile('#/my', 'Мой ассортимент', 'Реальные товары вашей аптеки: ' + d.assort.length) +
      tile('#/cheat', 'Шпаргалка на смену', 'Можно распечатать') + '</div>';
    return page('Аптека: старт', h);
  };
  function tile(href, t, d, badge) { return '<a class="tile" href="' + href + '">' + (badge || '') + '<span class="t">' + t + '</span><span class="d">' + d + '</span></a>'; }

  routes['1c'] = function () {
    var d = D();
    var h = '<p>Общее понимание учётной программы на базе 1С без привязки к конкретному интерфейсу. Каждый урок: короткая теория, схема, 5–7 вопросов.</p><div class="grid">';
    VA.lessons.forEach(function (l, i) {
      var st = d.lessons[l.id];
      var badge = st && st.done ? '<span class="badge ok badge">' + st.best + '/' + st.total + '</span>' : st ? '<span class="badge warn">' + st.best + '/' + st.total + '</span>' : '<span class="badge">' + l.min + ' мин</span>';
      h += tile('#/lesson/' + l.id, (i + 1) + '. ' + esc(l.title), esc(l.short), badge);
    });
    h += '</div><div class="card"><h2>Тренажёр «Касса»</h2><p>Интерактивная учебная касса на вымышленных товарах.</p><a class="btn primary" href="#/trainer">Открыть тренажёр</a></div>';
    return page('Модуль 1. 1С для новичка', h);
  };

  routes['lesson'] = function (id) {
    var l = lessonById(id); if (!l) return notFound();
    var i = VA.lessons.indexOf(l), next = VA.lessons[i + 1];
    var h = '<div class="card"><div class="schema">' + l.svg + '</div>' + l.body + '</div>' +
      '<h2>Проверьте себя</h2><div id="quiz"></div>' +
      '<div class="row">' + (next ? '<a class="btn" href="#/lesson/' + next.id + '">Следующий урок →</a>' : '<a class="btn" href="#/trainer">К тренажёру →</a>') + '</div>';
    setTimeout(function () {
      quiz($('#quiz'), withIds(l.quiz, 'L:' + l.id + ':', ''), function (r, t) {
        var st = D().lessons[l.id] || { best: 0, total: t };
        st.best = Math.max(st.best, r); st.total = t; if (r / t >= 0.7) st.done = true;
        D().lessons[l.id] = st; save();
        if (r / t >= 0.7) toast('Урок засчитан!'); else toast('Для зачёта нужно 70% верных ответов.');
      });

    return page(esc(l.title), h, { back: '#/1c' });
  };

  routes['assort'] = function () {
    var d = D();
    var h = '<p>Общий каталог даёт основу, но не заменяет реальный ассортимент вашей аптеки. Главный способ учить — раздел «Мой ассортимент» и карточки по нему.</p>';
    h += '<div class="grid two">' + tile('#/my', 'Мой ассортимент', 'Заполняете сами: ' + d.assort.length + ' позиций') +
      tile('#/test/mixed', 'Смешанный тест', 'Случайные вопросы по всем темам') +
      tile('#/test/wrong', 'Повтор ошибок', 'Вопросов с ошибками: ' + Object.keys(d.wrong).length) +
      tile('#/cards', 'Карточки', 'Интервальные повторения') + '</div>';
    h += '<h2>Основы</h2><div class="grid">';
    VA.assortPages.forEach(function (p) { h += tile('#/page/' + p.id, esc(p.title), ''); });
    h += '</div><h2>Группы по назначению</h2><div class="grid two">';
    VA.groups.forEach(function (g) {
      var st = d.groups[g.id];
      h += tile('#/group/' + g.id, esc(g.title), g.items.length + ' позиций-примеров', st ? '<span class="badge ' + (st.best / st.total >= 0.7 ? 'ok' : 'warn') + '">' + st.best + '/' + st.total + '</span>' : '');
    });
    h += '</div>';
    return page('Модуль 2. Ассортимент', h);
  };

  routes['page'] = function (id) {
    var p = VA.assortPages.filter(function (x) { return x.id === id; })[0]; if (!p) return notFound();
    setTimeout(function () { var t = $('#mnnTable'); if (t) t.innerHTML = mnnTable(); });
    return page(esc(p.title), '<div class="card">' + p.body + '</div>', { back: '#/assort' });
  };

  function mnnTable() {
    var rows = D().assort, map = {};
    rows.forEach(function (r) { var k = (r.mnn || '— МНН не указано').trim().toLowerCase(); (map[k] = map[k] || []).push(r); });
    var keys = Object.keys(map).sort();
    var h = '<div class="table-wrap"><table><tr><th>МНН</th><th>Торговые названия</th><th>Форма</th><th>Дозировка</th></tr>';
    if (!keys.length) {
      h += '<tr><td colspan="4" class="muted">Пока пусто. Добавьте позиции в «Мой ассортимент» — и таблица заполнится сама.</td></tr>';
      for (var i = 0; i < 4; i++) h += '<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>';
    }
    keys.forEach(function (k) {
      map[k].forEach(function (r, i) {
        h += '<tr>' + (i === 0 ? '<td rowspan="' + map[k].length + '"><b>' + esc(r.mnn || '—') + '</b></td>' : '') + '<td>' + esc(r.name) + '</td><td>' + esc(r.form) + '</td><td>' + esc(r.dose) + '</td></tr>';
      });
    });
    return h + '</table></div><p class="muted">Синонимы — это строки с одинаковыми МНН, дозировкой и формой.</p>';
  }

  routes['group'] = function (id) {
    var g = groupById(id); if (!g) return notFound();
    var h = '<p>' + esc(g.intro) + '</p>';
    h += '<div class="box check"><b>Важно про статус и дозировки</b>Названия ниже — примеры для ориентира. Статус отпуска, дозировки и возраст проверяйте по ГРЛС и инструкции конкретной позиции. Наличие в вашей аптеке — в «Моём ассортименте».</div>';
    h += '<h2>Основные МНН и примеры торговых названий</h2>';
    g.items.forEach(function (it) {
      h += '<div class="card" style="padding:12px 14px"><b>' + esc(it.tn) + '</b>' + (it.chk ? ' <span class="badge warn">проверить по источнику</span>' : '') +
        '<br><small class="muted">МНН / состав:</small> ' + esc(it.mnn) + '<br><small class="muted">Формы:</small> ' + esc(it.forms) +
        '<br><small class="muted">Внимание:</small> ' + esc(it.att) + '</div>';
    });
    h += '<h2>Кому нельзя без врача / тревожные признаки</h2><div class="box important"><ul>' + g.warn.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>';
    h += '<h2>Частые вопросы и как отвечать этично</h2>' + g.faq.map(function (f) { return '<details><summary>' + esc(f.q) + '</summary><p>' + esc(f.a) + '</p></details>'; }).join('');
    h += '<div class="grid two"><div class="card"><h3>Что сопутствует (без навязывания)</h3><ul>' + g.cross.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h3>На что смотреть в инструкции</h3><ul>' + g.instr.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div></div>';
    h += '<h2>Тест по группе</h2><div id="quiz"></div>';
    setTimeout(function () {
      quiz($('#quiz'), withIds(g.quiz, 'G:' + g.id + ':', ''), function (r, t) {
        var st = D().groups[g.id] || { best: 0, total: t };
        st.best = Math.max(st.best, r); st.total = t; D().groups[g.id] = st; save();
      });
    });
    return page(esc(g.title), h, { back: '#/assort' });
  };

  routes['test'] = function (kind) {
    var all = allQuestions(), qs, title;
    if (kind === 'wrong') {
      title = 'Повтор ошибок';
      qs = all.filter(function (q) { return D().wrong[q.id]; });
      if (!qs.length) return page(title, '<div class="card"><p>Ошибок для повтора нет. Пройдите уроки и тесты по группам — вопросы с ошибками появятся здесь.</p><a class="btn primary" href="#/test/mixed">Смешанный тест</a></div>', { back: '#/assort' });
      qs = shuffle(qs).slice(0, 15);
    } else {
      title = 'Смешанный тест';
      qs = shuffle(all).slice(0, 12);
    }
    setTimeout(function () { quiz($('#quiz'), qs, function () { }); });
    return page(title, '<p class="muted">Ответили верно — вопрос уходит из «повтора ошибок».</p><div id="quiz"></div>', { back: '#/assort' });
  };

  /* ---------- Карточки (Лейтнер) ---------- */
  var INTERVAL = { 1: 1, 2: 2, 3: 4, 4: 7, 5: 14 };
  function cardDeck() {
    var src = D().cardSource, out = [];
    if (src !== 'mine') VA.groups.forEach(function (g) {
      g.items.forEach(function (it, i) {
        out.push({ id: 'g:' + g.id + ':' + i, front: it.tn, back: [['МНН / состав', it.mnn], ['Группа', g.title], ['Формы', it.forms], ['Внимание', it.att]], chk: it.chk });
      });

    if (src !== 'base') D().assort.forEach(function (r) {
      if (r.inCards === false) return;
      out.push({ id: 'm:' + r.id, front: r.name + (r.dose ? ' ' + r.dose : ''), back: [['МНН', r.mnn], ['Группа', r.group], ['Форма', r.form], ['Особенности', r.features], ['Место', r.shelf]], mine: true });

  }
  function isDue(c) { var s = D().cards[c.id]; return !s || s.due <= store.today(); }

  routes['cards'] = function () {
    var d = D(), deck = cardDeck(), queue = shuffle(deck.filter(isDue)).sort(function (a, b) {
      var A = d.cards[a.id] ? d.cards[a.id].box : 0, B = d.cards[b.id] ? d.cards[b.id].box : 0; return A - B;
    });
    var boxes = [0, 0, 0, 0, 0, 0];
    deck.forEach(function (c) { boxes[d.cards[c.id] ? d.cards[c.id].box : 0]++; });
    var h = '<p>Система Лейтнера: «Знаю» — карточка переходит в следующую коробку и появится позже (через 1, 2, 4, 7, 14 дней). «Не знаю» — в первую коробку, повтор завтра и ещё раз сегодня в конце.</p>' +
      '<div class="card"><div class="row"><label for="src" style="margin:0">Колода</label><select id="src" style="flex:1;min-width:160px">' +
      [['all', 'Всё'], ['base', 'Базовая (примеры групп)'], ['mine', 'Мой ассортимент']].map(function (o) { return '<option value="' + o[0] + '"' + (d.cardSource === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></div><div class="row" style="margin-top:8px"><label for="goal" style="margin:0">Цель в день</label><input id="goal" type="number" min="5" max="200" value="' + d.cardGoal + '" style="width:90px" inputmode="numeric"></div>' +
      '<p style="margin-bottom:4px">Сегодня: <b id="todayCnt">' + (d.cardLog[store.today()] || 0) + '</b> из ' + d.cardGoal + '</p>' + bar(Math.min(d.cardLog[store.today()] || 0, d.cardGoal), d.cardGoal) +
      '<p class="muted" style="margin-top:8px">Новые: ' + boxes[0] + ' · Коробки 1–5: ' + boxes.slice(1).join(' · ') + '</p></div>' +
      '<div id="flashHost"></div>';
    setTimeout(function () {
      $('#src').addEventListener('change', function () { D().cardSource = this.value; save(); render(); });
      $('#goal').addEventListener('change', function () { D().cardGoal = Math.max(5, Math.min(200, parseInt(this.value, 10) || 20)); save(); render(); });
      runCards($('#flashHost'), queue);
    });
    return page('Карточки', h);
  };

  function runCards(el, queue) {
    var requeued = {};

  function importCSV(file) {
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var rows = store.parseCSV(String(rd.result));
        if (rows.length < 2) throw new Error('В файле нет строк с данными.');
        var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
        var idx = {};
        FIELDS.forEach(function (f) {
          var i = head.indexOf(f.title.toLowerCase()); if (i < 0) i = head.indexOf(f.key); if (i >= 0) idx[f.key] = i;
        });
        if (!('name' in idx)) throw new Error('Нет столбца «Название».');
        var existing = {}; D().assort.forEach(function (r) { existing[[r.name, r.dose, r.form].join('|').toLowerCase()] = 1; });
        var added = 0, skipped = 0;
        rows.slice(1).forEach(function (cells) {
          var o = { id: store.uid(), inCards: true };
          FIELDS.forEach(function (f) { o[f.key] = idx[f.key] != null ? String(cells[idx[f.key]] || '').trim() : ''; });
          if (!o.name) return;
          var k = [o.name, o.dose, o.form].join('|').toLowerCase();
          if (existing[k]) { skipped++; return; }
          existing[k] = 1; D().assort.push(o); added++;
        });
        save(); render(); toast('Добавлено: ' + added + (skipped ? ', пропущено повторов: ' + skipped : ''));
      } catch (e) { toast('Ошибка импорта: ' + e.message); }
    };
    rd.onerror = function () { toast('Не удалось прочитать файл'); };
    rd.readAsText(file, 'utf-8');
  }

  };

  routes['questions'] = function () {
    var h = '<form class="card no-print" id="qf"><label for="qt">Вопрос наставнику</label><textarea id="qt" placeholder="Например: как у нас оформляется возврат? Где отчёт по срокам?"></textarea>' +
      '<div class="row end"><button class="btn primary" type="submit">Добавить</button></div></form><div id="ql"></div>';
    setTimeout(function () {
      function draw() {
        var list = D().questions.slice().sort(function (a, b) { return (a.done - b.done) || (b.created - a.created); });
        $('#ql').innerHTML = list.length ? list.map(function (q) {
          return '<div class="card"' + (q.done ? ' style="opacity:.7"' : '') + '><label class="check-row"><input type="checkbox" data-done="' + q.id + '"' + (q.done ? ' checked' : '') + '> <b>' + esc(q.text) + '</b></label>' +
            '<label for="qa-' + q.id + '">Ответ</label><textarea id="qa-' + q.id + '" data-ans="' + q.id + '">' + esc(q.answer) + '</textarea>' +
            '<div class="row end"><button class="btn small danger" data-del="' + q.id + '">Удалить</button></div></div>';
        }).join('') : '<p class="muted">Вопросов пока нет. Записывайте всё, что непонятно, — и задавайте на смене.</p>';
        function find(id) { return D().questions.filter(function (x) { return x.id === id; })[0]; }
        $$('[data-done]').forEach(function (c) { c.addEventListener('change', function () { var q = find(c.getAttribute('data-done')); q.done = c.checked; save(); draw(); }); });
        $$('[data-ans]').forEach(function (ta) { ta.addEventListener('change', function () { var q = find(ta.getAttribute('data-ans')); q.answer = ta.value; save(); toast('Сохранено'); }); });
        $$('#ql [data-del]').forEach(function (b) { b.addEventListener('click', function () { if (confirm('Удалить вопрос?')) { var id = b.getAttribute('data-del'); D().questions = D().questions.filter(function (x) { return x.id !== id; }); save(); draw(); } }); });
      }
      $('#qf').addEventListener('submit', function (e) { e.preventDefault(); var v = $('#qt').value.trim(); if (!v) return; D().questions.push({ id: store.uid(), text: v, answer: '', done: false, created: Date.now() }); save(); $('#qt').value = ''; draw(); });
      draw();
    });
    return page('Вопросы наставнику', h, { back: '#/more' });
  };

  routes['backup'] = function () {
    var h = '<p>Прогресс, заметки, вопросы, «Мой ассортимент» и карточки хранятся <b>только в этом браузере</b>. Если очистить данные браузера или сменить телефон — они пропадут. Раз в несколько дней сохраняйте резервную копию.</p>' +
      '<div class="card"><h2>Сохранить копию</h2><p>Один файл .json со всеми данными. Храните его у себя (например, в «Файлах» телефона).</p>' +
      '<div class="row"><button class="btn primary" id="expBtn">Скачать резервную копию</button><button class="btn" id="expShow">Показать как текст</button></div><div id="expText"></div></div>' +
      '<div class="card"><h2>Восстановить из копии</h2><p>Текущие данные на этом устройстве будут <b>заменены</b> данными из файла.</p>' +
      '<label class="btn" style="margin:0">Выбрать файл .json<input type="file" id="impFile" accept=".json,application/json" hidden></label>' +
      '<details><summary>Вставить текст копии вручную</summary><textarea id="impText" placeholder="Вставьте сюда текст резервной копии"></textarea><button class="btn" id="impTextBtn">Восстановить из текста</button></details></div>' +
      '<div class="card"><h2>Сбросить всё</h2><p>Удалит весь прогресс и записи на этом устройстве.</p><button class="btn danger" id="resetBtn">Сбросить</button></div>';
    setTimeout(function () {
      function json() { return JSON.stringify(store.exportObject(), null, 1); }
      $('#expBtn').addEventListener('click', function () {
        if (store.download('vika-aptek-kopiya-' + store.today() + '.json', json(), 'application/json')) toast('Файл сохранён в «Загрузки»');
        else showText();
      });
      function showText() {
        $('#expText').innerHTML = '<textarea readonly id="expTa" style="min-height:160px">' + esc(json()) + '</textarea><button class="btn small" id="copyBtn">Скопировать</button>';
        $('#copyBtn').addEventListener('click', function () {
          var ta = $('#expTa'); ta.select();
          var done = function () { toast('Скопировано'); };
          try { if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, function () { document.execCommand('copy'); done(); }); else { document.execCommand('copy'); done(); } } catch (e) { toast('Выделите текст и скопируйте вручную'); }
        });
      }
      $('#expShow').addEventListener('click', showText);
      function doImport(text) {
        try {
          var obj = JSON.parse(text);
          if (!confirm('Заменить текущие данные данными из копии?')) return;
          store.importObject(obj); toast('Данные восстановлены'); location.hash = '#/';
        } catch (e) { toast('Не получилось: ' + (e.message || 'файл повреждён')); }
      }
      $('#impFile').addEventListener('change', function () {
        var f = this.files[0]; if (!f) return; var rd = new FileReader();
        rd.onload = function () { doImport(String(rd.result)); }; rd.readAsText(f, 'utf-8'); this.value = '';
      });
      $('#impTextBtn').addEventListener('click', function () { doImport($('#impText').value); });
      $('#resetBtn').addEventListener('click', function () {
        if (confirm('Точно удалить весь прогресс и записи?') && confirm('Это нельзя отменить. Удалить?')) { store.reset(); toast('Сброшено'); location.hash = '#/'; }
      });
    });
    return page('Резервная копия', h, { back: '#/more' });
  };

  routes['about'] = function () {
    var h = '<div class="card"><h2>Для чего этот сайт</h2><p>Личный учебный помощник для старта работы фармацевтом: общая логика учётной программы, тренажёр кассы, ассортимент, общение с покупателем. Работает без интернета, ничего никуда не отправляет.</p></div>' +
      '<div class="card"><h2>Что сайт не заменяет</h2><ul><li>Обучение у работодателя и инструкции аптеки.</li><li>Наставника и старшего смены.</li><li>Инструкции к препаратам и официальные реестры.</li><li>Действующие нормативные документы.</li></ul></div>' +
      '<div class="card"><h2>Где проверять</h2><ul>' +
      '<li>Государственный реестр лекарственных средств — grls.rosminzdrav.ru (регистрация, инструкции, условия отпуска, взаимозаменяемость, предельные цены ЖНВЛП).</li>' +
      '<li>Перечень ЖНВЛП — действующее распоряжение Правительства РФ (publication.pravo.gov.ru).</li>' +
      '<li>Правила отпуска и оформления рецептов, правила хранения, надлежащая аптечная практика — приказы Минздрава России (publication.pravo.gov.ru).</li>' +
      '<li>Маркировка — официальный сайт системы «Честный знак».</li>' +
      '<li>Медицинские изделия — реестр Росздравнадзора.</li></ul>' +
      '<p>Пометка <span class="badge warn">проверить по источнику</span> означает, что сведения нужно сверить: статус мог измениться или зависит от конкретной позиции.</p></div>' +
      '<div class="card"><h2>Примеры и данные</h2><p>Товары в тренажёре и примеры в уроках («Термоглин», «Условин-Учеб», «Учебин» и т. п.) — вымышленные. Цены — условные единицы. Названия реальных препаратов в Модуле 2 приведены только как общеизвестные примеры торговых названий для запоминания МНН.</p></div>';
    return page('Об этом сайте', h, { back: '#/more' });
  };

  function notFound() { return page('Страница не найдена', '<p><a href="#/">На главную</a></p>'); }

  /* ---------- Роутер ---------- */
  function render() {
    var hash = location.hash.replace(/^#\/?/, '');
    var parts = hash.split('/').map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
    var name = parts[0] || '';
    var fn = routes[name] || notFound;
    app.innerHTML = fn(parts[1], parts[2]);
    var navKey = { '': 'home', '1c': '1c', lesson: '1c', trainer: '1c', assort: 'assort', page: 'assort', group: 'assort', my: 'assort', test: 'assort', cards: 'cards' }[name] || 'more';
    $$('.bottomnav a', document).forEach(function (a) {
      var on = a.getAttribute('data-nav') === navKey; a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    $$('[data-plan]').forEach(function (c) {
      c.addEventListener('change', function () { D().plan[c.getAttribute('data-plan')] = c.checked; save(); });
    });
  }
  var lastRoute = null;
  window.addEventListener('hashchange', function () {
    var r = location.hash.split('/')[1] || '';
    if (r !== 'my') myState.edit = null;
    render();
    if (lastRoute !== location.hash) { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
    lastRoute = location.hash;
  });

  /* ---------- Тема ---------- */
  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  }
  themeBtn.addEventListener('click', function () {
    var order = ['auto', 'light', 'dark'], cur = store.getTheme(), nx = order[(order.indexOf(cur) + 1) % 3];
    store.setTheme(nx); applyTheme(nx);
    toast('Тема: ' + { auto: 'как в системе', light: 'светлая', dark: 'тёмная' }[nx]);
  });

  VA.render = render;
  render();
})();
</script>
</body>
</html>
